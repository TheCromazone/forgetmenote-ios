name: ForgetMeNote
options:
  bundleIdPrefix: com.imageorganizer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: DBCJXPJXQJ
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  Mantis:
    url: https://github.com/guoyingtao/Mantis
    from: 2.20.0

targets:
  ForgetMeNote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Pods/Target Support Files/Pods-ForgetMeNote/Pods-ForgetMeNote.debug.xcconfig
      Release: Pods/Target Support Files/Pods-ForgetMeNote/Pods-ForgetMeNote.release.xcconfig
    info:
      path: ForgetMeNote/Info.plist
      properties:
        CFBundleDisplayName: FMN v3
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Forget Me Note uses the camera so you can photograph rooms, items, and spaces to organize visually."
        NSPhotoLibraryUsageDescription: "Forget Me Note can import photos from your library when creating new items."
        NSPhotoLibraryAddUsageDescription: "Forget Me Note saves exported backups to your photo library if you ask."
        NSMicrophoneUsageDescription: "Voice input transcribes what you say into item names, tags, and notes."
        NSSpeechRecognitionUsageDescription: "Speech recognition turns your voice into item names, tags, and notes."
        BGTaskSchedulerPermittedIdentifiers:
          - com.matthewcromaz.forgetmenote.v3.dev.updatedItemsReminder
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: ForgetMeNote
        excludes:
          - "Info.plist"
          - "V4/Info.plist"
          - "Notes/**"
          - "README.md"
    settings:
      base:
        # Personal bundle ID for free-signing / paid-personal-account development.
        # At Phase 8 (TestFlight) we swap to com.imageorganizer.app once it's
        # registered under the user's Apple Developer team in App Store Connect.
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewcromaz.forgetmenote.v3.dev
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"ForgetMeNote/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: ZIPFoundation
      - package: GRDB
        product: GRDB
      - package: Mantis

  ForgetMeNoteV4:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Pods/Target Support Files/Pods-ForgetMeNoteV4/Pods-ForgetMeNoteV4.debug.xcconfig
      Release: Pods/Target Support Files/Pods-ForgetMeNoteV4/Pods-ForgetMeNoteV4.release.xcconfig
    info:
      path: ForgetMeNote/V4/Info.plist
      properties:
        CFBundleDisplayName: FMN v4
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Forget Me Note uses the camera so you can photograph rooms, items, and spaces to organize visually."
        NSPhotoLibraryUsageDescription: "Forget Me Note can import photos from your library when creating new items."
        NSPhotoLibraryAddUsageDescription: "Forget Me Note saves exported backups to your photo library if you ask."
        NSMicrophoneUsageDescription: "Voice input transcribes what you say into item names, tags, and notes."
        NSSpeechRecognitionUsageDescription: "Speech recognition turns your voice into item names, tags, and notes."
        BGTaskSchedulerPermittedIdentifiers:
          - com.matthewcromaz.forgetmenote.v4.dev.updatedItemsReminder
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: ForgetMeNote
        excludes:
          - "Info.plist"
          - "V4/Info.plist"
          - "Notes/**"
          - "README.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewcromaz.forgetmenote.v4.dev
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV4
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"ForgetMeNote/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -D FMN_V4"
    dependencies:
      - package: ZIPFoundation
      - package: GRDB
        product: GRDB
      - package: Mantis

  ForgetMeNoteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ForgetMeNoteTests
    dependencies:
      - target: ForgetMeNote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthewcromaz.forgetmenote.v3.dev.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ForgetMeNote.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ForgetMeNote"

schemes:
  ForgetMeNote:
    build:
      targets:
        ForgetMeNote: all
        ForgetMeNoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ForgetMeNoteTests
    archive:
      config: Release
  ForgetMeNoteV4:
    build:
      targets:
        ForgetMeNoteV4: all
    run:
      config: Debug
    archive:
      config: Release
