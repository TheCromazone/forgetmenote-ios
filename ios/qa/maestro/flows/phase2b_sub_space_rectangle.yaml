# Phase 2b verification flow — sub-space creation with InteractiveRectangleSelector.
#
# Bypasses BOTH the PhotosPicker AND the tree-row navigation gesture (Maestro
# can't reliably drive SwiftUI's onTapGesture(count: 2)). Uses two debug menu
# actions to: 1) create a root Space, 2) jump straight to CreateChildScreen for
# a sub-space under that Space.
#
# Verifies:
# - Root Space creation works (Insert demo Space + OK)
# - "Insert demo Sub-Space combo" navigates to CreateChildScreen with the
#   parent's image and the InteractiveRectangleSelector visible
# - The rectangle selector renders with the "Where on" prompt
# - Dragging the rectangle works (visual proof via screenshot diff)
# - Save creates a child item which appears in the tree
#
# Run from the ios/ directory:
#   maestro test qa/maestro/flows/phase2b_sub_space_rectangle.yaml

appId: com.matthewcromaz.forgetmenote.v3.dev
---
- clearState
- launchApp:
    clearKeychain: true

- assertVisible: "Forget Me Note"

# 1. Create a root Space
- tapOn:
    id: "Menu"
- tapOn:
    id: "Insert demo Space"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "ok-button"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible: "Demo Photo"
    timeout: 5000
- takeScreenshot: 01_root_space_created

# 2. Jump straight to sub-space creation under that Space
- tapOn:
    id: "Menu"
- tapOn:
    id: "Insert demo Sub-Space combo"
- waitForAnimationToEnd:
    timeout: 3000

# 3. CreateChildScreen for a Space parent should show the rectangle selector
- extendedWaitUntil:
    visible: "New Sub-Space"
    timeout: 5000
- assertVisible: "New photo"
- assertVisible: "Demo Sub"
- takeScreenshot: 02_rectangle_selector_visible

# 4. Drag the rectangle around — visual proof the selector is interactive
- swipe:
    start: "50%, 50%"
    end: "65%, 65%"
- takeScreenshot: 03_after_rectangle_drag

# 5. Save the sub-space
- tapOn:
    id: "ok-button"
- waitForAnimationToEnd:
    timeout: 3000

# 6. Back on MainScreen. The parent's tree row now has a chevron (collapsed
#    children), proving the sub-space was added. Tap the chevron to expand
#    and verify the child appears.
- extendedWaitUntil:
    visible: "Forget Me Note"
    timeout: 5000
- assertVisible: "Demo Photo"
- takeScreenshot: 04_back_at_main_collapsed

# Navigate into Demo Photo's detail screen to see Children list (more reliable
# than trying to find/tap the small chevron in the tree row).
- tapOn:
    id: "Menu"
- tapOn:
    id: "Insert demo Sub-Space combo"
- waitForAnimationToEnd:
    timeout: 3000
# This brings us back into CreateChildScreen for ANOTHER sub-space. Cancel.
- tapOn:
    id: "cancel-button"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 05_done
